<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Preview</title>
  </head>
  <body>
    <header id="topbar">
      <h1 id="doc-title"></h1>
      <span id="source-label"></span>
      <a id="source-link" target="_blank" rel="noopener noreferrer" hidden>開啟原始來源</a>
    </header>
    <div id="banner" hidden></div>
    <div id="layout">
      <aside id="sidebar" hidden></aside>
      <main id="main">
        <article id="content" class="markdown-body"></article>
        <nav id="pager" hidden>
          <button id="prev" type="button">上一頁</button>
          <button id="next" type="button">下一頁</button>
        </nav>
      </main>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
