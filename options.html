<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Quick Preview 設定</title>
  </head>
  <body>
    <main class="options">
      <h1>Markdown Quick Preview 設定</h1>
      <section>
        <h2>GitHub Personal Access Tokens</h2>
        <p>
          Token 只存在本機 chrome.storage.local。fine-grained token 只能綁定一個 owner，可為不同 owner 或 repo
          各設一個。比對順序：owner/repo → owner → *（預設）。
        </p>
        <div id="rules"></div>
        <div class="actions">
          <button id="add-rule" type="button">新增規則</button>
          <button id="save" type="button">儲存</button>
        </div>
        <p id="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/options/main.ts"></script>
  </body>
</html>
